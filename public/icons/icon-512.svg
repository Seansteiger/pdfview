<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing Sheet Graphic -->
  <g transform="translate(116, 96)" filter="url(#glow)">
    <!-- Document Body -->
    <path d="M 0 32 C 0 14.3 14.3 0 32 0 L 192 0 L 280 88 L 280 288 C 280 305.7 265.7 320 248 320 L 32 320 C 14.3 320 0 305.7 0 288 Z" fill="#1e1e24" stroke="url(#accent)" stroke-width="6"/>
    
    <!-- Folded Corner -->
    <path d="M 192 0 L 192 88 L 280 88 Z" fill="url(#accent)" opacity="0.85"/>
    
    <!-- PDF Text / Lines -->
    <rect x="44" y="130" width="120" height="20" rx="10" fill="url(#accent)"/>
    <rect x="44" y="174" width="192" height="12" rx="6" fill="#71717a" opacity="0.7"/>
    <rect x="44" y="206" width="160" height="12" rx="6" fill="#71717a" opacity="0.7"/>
    <rect x="44" y="238" width="130" height="12" rx="6" fill="#71717a" opacity="0.7"/>

    <!-- Vibe Badge -->
    <circle cx="210" cy="246" r="34" fill="url(#accent)"/>
    <path d="M 200 246 L 207 253 L 222 238" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
